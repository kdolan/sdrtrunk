/**
 * Runtime target OS and CPU image names.  We append version here so that version details are at end of zip filename.
 */
String targetLinuxAarch64 = 'linux-aarch64-v' + version
String targetLinuxX86_64 = 'linux-x86_64-v' + version
String targetOsxAarch64 = 'osx-aarch64-v' + version
String targetOsxX86_64 = 'osx-x86_64-v' + version
String targetWindowsX86_64 = 'windows-x86_64-v' + version
String targetWindowsAarch64 = 'windows-aarch64-v' + version

/**
 * Download URLs to download the JDK as part of the gradle build packaging process
 */
def jdk_download_base = "https://download.bell-sw.com/java/27+36/bellsoft-jdk27+36-"
def jdk_download_suffix = "-full.tar.gz"
def jdk_download_linux_aarch64 = jdk_download_base + "linux-aarch64" + jdk_download_suffix
def jdk_download_linux_x86_64 = jdk_download_base + "linux-amd64" + jdk_download_suffix
def jdk_download_osx_x86_64 = jdk_download_base + "macos-amd64" + jdk_download_suffix
def jdk_download_osx_aarch64 = jdk_download_base + "macos-aarch64" + jdk_download_suffix
def jdk_download_windows_x86_64 = jdk_download_base + "windows-amd64-full.zip"
def jdk_download_windows_aarch64 = jdk_download_base + "windows-aarch64-full.zip"

/**
 * Configures the runtime zip task with additional options/settings.
 * @param rt task to configure
 * @param jvmArgs to use (windows or linux)
 * @return configured task.
 */
def configure(RuntimeZipTask rt, List<String> jvmArgs) {
    //Use the correct set of JVM arguments
    rt.extension.launcherData.get().jvmArgs = jvmArgs

    //Additional modules to include with auto-detected modules.
    //jdk.charsets - NXDN BIG5 encoding support
    //jdk.crypto.ec - needed for HTTPS connections (broadcastify calls & map tile server)
    //jdk.incubator.vector - needed for Project Panama foreign function and vector apis
    //jdk.accessibility is used with assistive technologies like screen readers
    //java.management for JVM resource monitoring
    //java.base, java.logging, java.net.http, java.prefs, javafx.controls, javafx.swing - required by sdrtrunk (jdeps)
    rt.extension.addModules('jdk.charsets', 'jdk.crypto.ec', 'jdk.incubator.vector', 'jdk.accessibility', 'java.management',
            'java.base', 'java.logging', 'java.net.http', 'java.prefs', 'javafx.controls', 'javafx.swing')

    //Use only the modules listed above.  The runtime plugin's module auto-detection uses a bundled ASM library that
    //can't read Java 27 class files and logs a 'Failed to scan' error for each sdrtrunk class.  The jdeps module check
    //on the runtime task verifies that this list is complete.
    rt.extension.additive.set(false)

    //Recommended options for reducing/shrinking runtime target image size
    rt.extension.addOptions('--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages')

    //Runtime images have auto appended version in image zip name.  Override to include version in single target image.
//    rt.extension.imageDir=layout.buildDirectory.dir('image')
    rt.extension.imageZip.set(file(layout.buildDirectory.dir('image').get().file('sdr-trunk.zip')))
}

/**
 * Native library folders to keep in each runtime target image, keyed by the target name prefix.  The tuner libraries
 * (jRTL, jAirspy, etc.) package their native libraries under '<library>/native/<os>-<arch>/' and jSerialComm packages
 * them under '<OS>/<arch>/'.  All other operating system and architecture folders are removed from the target image.
 */
def nativeFolders = [
        'linux-aarch64'  : [tuner: 'linux-aarch64',   serial: 'Linux/armv8_64'],
        'linux-x86_64'   : [tuner: 'linux-x86_64',    serial: 'Linux/x86_64'],
        'osx-aarch64'    : [tuner: 'macos-aarch64',   serial: 'OSX/aarch64'],
        'osx-x86_64'     : [tuner: 'macos-x86_64',    serial: 'OSX/x86_64'],
        'windows-aarch64': [tuner: 'windows-aarch64', serial: 'Windows/aarch64'],
        'windows-x86_64' : [tuner: 'windows-x86_64',  serial: 'Windows/x86_64']
]

/**
 * Top level folders that jSerialComm uses for its per-OS native libraries.
 */
def serialOsFolders = ['Android', 'FreeBSD', 'Linux', 'OpenBSD', 'OSX', 'Solaris', 'Windows'] as Set

/**
 * Rewrites the jar file without the native library folders for other operating systems and architectures.  Fails the
 * build if a jar that contains native libraries doesn't contain the folder for the target.
 * @param jar file to rewrite
 * @param keep native folders for the target (tuner and serial)
 * @param serialOsFolders jSerialComm top level OS folders
 * @return number of bytes removed from the jar
 */
long stripJar(File jar, Map<String,String> keep, Set<String> serialOsFolders) {
    def tunerPattern = ~/^[^\/]+\/native\/([^\/]+)\/.*/
    def serialPrefix = keep.serial + '/'
    def removed = [] as Set
    def hadTuner = false, keptTuner = false, hadSerial = false, keptSerial = false
    File temp = new File(jar.parentFile, jar.name + '.tmp')

    new java.util.zip.ZipFile(jar).withCloseable { zip ->
        def entries = zip.entries().toList()

        entries.each { e ->
            def tuner = tunerPattern.matcher(e.name)
            def top = e.name.contains('/') ? e.name.substring(0, e.name.indexOf('/')) : null

            if(tuner.matches()) {
                hadTuner = true
                if(tuner.group(1) == keep.tuner) { keptTuner = true } else { removed << e.name }
            }
            else if(top in serialOsFolders) {
                hadSerial = true
                if(e.name.startsWith(serialPrefix)) { keptSerial = true } else { removed << e.name }
            }
        }

        if(hadTuner && !keptTuner) {
            throw new GradleException("Native strip: ${jar.name} has no native/${keep.tuner} folder")
        }
        if(hadSerial && !keptSerial) {
            throw new GradleException("Native strip: ${jar.name} has no ${keep.serial} folder")
        }

        if(!removed.isEmpty()) {
            new java.util.zip.ZipOutputStream(new FileOutputStream(temp)).withCloseable { out ->
                entries.findAll { !removed.contains(it.name) }.each { e ->
                    def copy = new java.util.zip.ZipEntry(e)
                    if(copy.method == java.util.zip.ZipEntry.DEFLATED) {
                        copy.compressedSize = -1
                    }
                    out.putNextEntry(copy)
                    zip.getInputStream(e).withCloseable { out << it }
                    out.closeEntry()
                }
            }
        }
    }

    if(removed.isEmpty()) {
        return 0
    }

    long before = jar.length()
    java.nio.file.Files.move(temp.toPath(), jar.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    return before - jar.length()
}

/**
 * Removes the native libraries for other operating systems and architectures from the jars in each runtime target
 * image, before the runtimeZip tasks package the images.
 */
tasks.named('runtime') {rt ->
    rt.doLast {
        rt.targetPlatforms.get().keySet().each { target ->
            def key = nativeFolders.keySet().find { target.startsWith(it + '-') }

            if(key == null) {
                throw new GradleException("Native strip: no native folder mapping for runtime target [${target}]")
            }

            def lib = new File(rt.imageDir.asFile, "${project.name}-${target}/lib")
            long total = 0
            lib.listFiles({ File f -> f.name.endsWith('.jar') } as FileFilter).each { jar ->
                total += stripJar(jar, nativeFolders[key], serialOsFolders)
            }
            logger.lifecycle("Native strip: removed ${String.format('%.1f', total / 1048576)} MB of other " +
                    "platform native libraries from [${target}]")
        }
    }
}

/**
 * Verifies that each runtime target image contains every module that the sdrtrunk jar requires, as reported by jdeps.
 * This guards against the runtime plugin's module auto-detection silently missing modules (e.g. when it can't parse
 * class files compiled for a newer Java version).
 */
def jdepsHome = javaToolchains.launcherFor(java.toolchain).map { it.metadata.installationPath.asFile }
def mainJar = tasks.named('jar').flatMap { it.archiveFile }

tasks.named('runtime') {rt ->
    rt.doLast {
        def jdeps = new File(jdepsHome.get(), 'bin/' + (os.isWindows() ? 'jdeps.exe' : 'jdeps')).absolutePath
        def process = new ProcessBuilder(jdeps, '--multi-release', java.toolchain.languageVersion.get().toString(),
                '--ignore-missing-deps', '--print-module-deps', '-q', mainJar.get().asFile.absolutePath)
                .redirectErrorStream(true).start()
        def output = process.inputStream.text.trim()

        if(process.waitFor() != 0) {
            throw new GradleException("Module check: jdeps failed: ${output}")
        }

        def required = output.split(',')*.trim().findAll { it } as Set

        rt.targetPlatforms.get().keySet().each { target ->
            def release = new File(rt.imageDir.asFile, "${project.name}-${target}/release")
            def match = release.text =~ /(?m)^MODULES="([^"]*)"/

            if(!match.find()) {
                throw new GradleException("Module check: no MODULES entry in ${release}")
            }

            def missing = required - (match.group(1).split(' ') as Set)

            if(missing) {
                throw new GradleException("Module check: runtime image [${target}] is missing required modules " +
                        "${missing.sort()} - add them to addModules() in build.gradle")
            }
        }
        logger.lifecycle("Module check: runtime images contain all modules required by sdrtrunk: ${required.sort()}")
    }
}

/**
 * Creates a release package for the current operating system.
 *
 * Note: you cannot create both Windows and Linux releases at the same time due to limitations of the Runtime plugin
 *
 * Usage: gradle runtimeZipCurrent
 * Usage: gradlew runtimeZipCurrent   (windows - using gradlew)
 * Usage: ./gradlew runtimeZipCurrent   (linux - using gradlew)
 */
tasks.register('runtimeZipCurrent', RuntimeZipTask) {rt ->
    def arch = System.properties.getProperty("os.arch")
    def javaHome = Jvm.current().getJavaHome().toString()

    if(os.isWindows()) {
        if(arch == "amd64") {
            rt.extension.targetPlatform(targetWindowsX86_64, javaHome)
        }
        else if(arch == "aarch64") {
            rt.extension.targetPlatform(targetWindowsAarch64, javaHome)
        }
        configure(rt, jvmArgsWindows)
    }
    else if(os.isLinux())
    {
        if(arch == "amd64") {
            rt.extension.targetPlatform(targetLinuxX86_64, javaHome)
        }
        else if(arch == "aarch64") {
            rt.extension.targetPlatform(targetLinuxAarch64, javaHome)
        }
        configure(rt, jvmArgsLinux)
    }
    else if(os.isMacOsX())
    {
        if(arch == "amd64") {
            rt.extension.targetPlatform(targetOsxX86_64, javaHome)
        }
        else if(arch == "aarch64") {
            rt.extension.targetPlatform(targetOsxAarch64, javaHome)
        }
        configure(rt, jvmArgsLinux)
    }
}


/**
 * Creates a Windows release package.
 *
 * Note: you cannot create both Windows and Linux releases at the same time due to limitations of the Runtime plugin
 *
 * Usage: gradle runtimeZipWindows
 * Usage: gradlew runtimeZipWindows   (windows - using gradlew)
 * Usage: ./gradlew runtimeZipWindows   (linux - using gradlew)
 */
tasks.register('runtimeZipWindows', RuntimeZipTask) {rt ->
    //Windows aarch64
    rt.extension.targetPlatform(targetWindowsAarch64) {
        jdkHome = jdkDownload(jdk_download_windows_aarch64)
    }
    //Windows x86-64
    rt.extension.targetPlatform(targetWindowsX86_64) {
        jdkHome = jdkDownload(jdk_download_windows_x86_64)
    }

    configure(rt, jvmArgsWindows)
}

/**
 * Creates Linux & OSX release packages.
 *
 * Note: you cannot create both Windows and Linux releases at the same time due to limitations of the Runtime plugin
 *
 * Usage: gradle runtimeZipOthers
 * Usage: gradlew runtimeZipOthers   (windows - using gradlew)
 * Usage: ./gradlew runtimeZipOthers   (linux - using gradlew)
 */
tasks.register('runtimeZipOthers', RuntimeZipTask) {rt ->
    //Linux aarch64
    rt.extension.targetPlatform(targetLinuxAarch64) {
        jdkHome = jdkDownload(jdk_download_linux_aarch64)
    }
    //Linux x86-64
    rt.extension.targetPlatform(targetLinuxX86_64) {
        jdkHome = jdkDownload(jdk_download_linux_x86_64)
    }
    //OSX aarch64
    rt.extension.targetPlatform(targetOsxAarch64) {
        jdkHome = jdkDownload(jdk_download_osx_aarch64)
    }
    //OSX x86-64
    rt.extension.targetPlatform(targetOsxX86_64) {
        jdkHome = jdkDownload(jdk_download_osx_x86_64)
    }

    configure(rt, jvmArgsLinux)
}

/**
 * Runs the LSM v2 comparison test against a baseband WAV file.
 * Usage: ./gradlew runComparison -PbasebandFile=path/to/baseband.wav [-Pnac=117]
 */
tasks.register('runComparison', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.dsheirer.module.decode.p25.phase1.LSMv2ComparisonTest'
    if(os.isWindows()) {
        jvmArgs = jvmArgsWindows
    } else {
        jvmArgs = jvmArgsLinux
    }
    def argsList = []
    if(project.hasProperty('basebandFile')) {
        argsList.add(project.property('basebandFile'))
    }
    if(project.hasProperty('nac')) {
        argsList.add(project.property('nac'))
    }
    args = argsList
}

/**
 * Runs the audio comparison test with IMBE decoding and WAV output.
