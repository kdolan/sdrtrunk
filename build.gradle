        argsList.add(project.property('outputDir'))
    }
    args = argsList
}

/**
 * Extracts a time segment from a baseband WAV file for isolated testing.
 * Usage: ./gradlew extractSegment -PinputFile=input.wav -PoutputFile=segment.wav -PstartMs=45000 -PendMs=46000
 */
tasks.register('extractSegment', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'io.github.dsheirer.module.decode.p25.phase1.SegmentExtractor'
    if(os.isWindows()) {
        jvmArgs = jvmArgsWindows
    } else {
        jvmArgs = jvmArgsLinux
    }
    def argsList = []
    if(project.hasProperty('inputFile')) {
        argsList.add(project.property('inputFile'))
    }
    if(project.hasProperty('outputFile')) {
        argsList.add(project.property('outputFile'))
    }
