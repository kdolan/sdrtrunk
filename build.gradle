import org.beryx.runtime.RuntimeZipTask
import org.gradle.internal.jvm.Jvm
import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

import java.text.SimpleDateFormat

/**
 * Instructions for building/compiling the sdrtrunk application.
 *
 * Prerequisites:
 * Install and configure an OpenJDK version 27+ that includes the JavaFX modules (e.g. Bellsoft Liberica JDK)
 * - Optional: install and configure Gradle 9.8+
 *
 * Scenario 1: run the application via gradle command line from the source code root directory:
 * command: ./gradlew run
 *
 * Scenario 2: create an application release for the current operating system
 * command: ./gradlew runtimeZipCurrent
 * Note: release image is located in the /build/image/ directory
 *
 * Scenario 3: create releases for Linux and OSX operating systems using downloaded JDKs
 * command: ./gradlew runtimeZipOthers
 * Note: release images are located in the /build/image/ directory
 *
 * Scenario 4: create release for Windows operating system using downloaded JDK
 * command: ./gradlew runtimeZipWindows
 * Note: release image is located in the /build/image/ directory
 */
plugins {
    id 'application'
    id 'java'
    id 'idea'
    id 'org.beryx.runtime' version '2.0.1'
}

//Version is defined in gradle.properties so that we can CLI override it for nightly builds.
version = project.findProperty('projectVersion')

//Java 27 is required for this version of the Project Panama preview/incubator feature
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(27)
        vendor = JvmVendorSpec.BELLSOFT
    }
}

/**
 * Verifies that the selected toolchain JDK includes the JavaFX modules (e.g. Bellsoft Liberica 'Full JDK').
 *
 * Gradle's toolchain spec can only select by language version, vendor and implementation, so it can't distinguish
 * between the Liberica JDK packages that do and don't bundle JavaFX. This task fails the build with a clear message
 * instead of allowing compilation to fail with missing javafx packages.
 */
tasks.register('verifyToolchainJavaFx') {
    def jdkHome = javaToolchains.launcherFor(java.toolchain).map { it.metadata.installationPath.asFile }

    doLast {
        def release = new File(jdkHome.get(), 'release')

        if(!release.exists() || !release.text.contains('javafx.base')) {
            throw new GradleException("The JDK at [${jdkHome.get()}] does not include the JavaFX modules. Install " +
                    "the Bellsoft Liberica JDK 27 'Full' package (includes LibericaFX), or use " +
                    "-Porg.gradle.java.installations.paths=<jdk path> to specify the JDK that Gradle should use.")
        }
    }
}

tasks.named('compileJava') {
    dependsOn 'verifyToolchainJavaFx'
}

test {
    useJUnitPlatform()
}

