# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix: 
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'liberica'
          java-package: 'jdk+fx'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build with Gradle
        run: ./gradlew clean build
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          shopt -s nullglob
          for f in build/test-results/test/*.xml; do
            awk 'match($0, /<testcase name="[^"]*" classname="[^"]*"/) { t = substr($0, RSTART, RLENGTH); gsub(/<testcase name="|"/, "", t); sub(/ classname=/, " ", t); split(t, a, " "); test = a[2] "." a[1] }
                 match($0, /<failure message="[^"]*"/) { m = substr($0, RSTART + 18, RLENGTH - 19); print "::error title=" test "::" substr(m, 1, 900) }' "$f"
          done
